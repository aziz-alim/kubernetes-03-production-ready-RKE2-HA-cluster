apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/aziz-alim/kubernetes-03-production-ready-RKE2-HA-cluster'
    path: deployments/django-chart
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: django-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true